# =============================================================================
# Firma DKIM del correo saliente
# =============================================================================
# Ubicacion dentro del contenedor: /etc/rspamd/local.d/dkim_signing.conf
#
# Opciones verificadas contra el codigo fuente de la version 4.2.2:
#   https://github.com/rspamd/rspamd/blob/4.2.2/src/plugins/lua/dkim_signing.lua
#
# -----------------------------------------------------------------------------
# ANTES DE ACTIVAR ESTO, LEAS ejemplos/dkim-y-dns-demostracion.md
# -----------------------------------------------------------------------------
# Firmar sin publicar el registro DNS deja el correo SALIENDO sin firma, y los
# receptores lo tratan como posible suplantacion: el cliente se queja de que
# "antes no pasaba nada y ahora llega a spam".
# -----------------------------------------------------------------------------

# Selectores. Si el cliente tiene mas de un dominio, se listan todos.
# El valor "dkim" es el que usa por defecto Rspamd 4.2.2.
domain = ["ejemplo.cl", "www.ejemplo.cl"];

selector = "dkim";

# Ruta donde Rspamd busca la clave privada de cada par dominio/selector.
# Con el volumen del kit (/var/lib/rspamd) queda en:
#   /var/lib/rspamd/dkim/ejemplo.cl.dkim.key
# Esta ruta esta DENTRO del volumen persistente, por eso el respaldo la guarda.
path = "$DBDIR/dkim/$domain.$selector.key";

# Firmar el correo que sale por cuentas autenticadas (SASL) en Postfix.
# Asi el usuario@example.cl que se autentica produce correo firmado.
sign_authenticated = true;

# Firmar el correo generado localmente por el propio servidor.
sign_local = true;

# -----------------------------------------------------------------------
# ESTE ES EL AJUSTE MAS IMPORTANTE DEL ARCHIVO
# -----------------------------------------------------------------------
# Con `check_pubkey = true`, Rspamd consulta el registro TXT
#   <selector>._domainkey.<dominio>
# ANTES de firmar. Si el registro no existe o esta roto, NO firma y lo deja
# asentado en el log. Es la red de seguridad que evita el escenario de
# "firmo con una clave que nadie conoce".
check_pubkey = true;

# Firmar el correo cuyo remitente no calza con el usuario autenticado.
# Se deja en `false` a proposito: permitirlo abre la puerta a suplantar a
# cualquier remitente desde una cuenta legitima.
allow_username_mismatch = false;

# Firmar aunque el From no pertenezca a los dominios declarados arriba.
# Igual que el anterior: en `false` por seguridad.
allow_hdrfrom_mismatch = false;

# Guardar tambien las claves en Redis.
# Util si el cliente corre mas de una instancia de Rspamd y quiere que todas
# firmen con la misma clave.
use_redis = false;