# =============================================================================
# Lista blanca: la red de seguridad contra falsos positivos
# =============================================================================
# Ubicacion dentro del contenedor: /etc/rspamd/local.d/whitelist.conf
#
# Opciones verificadas contra el codigo fuente de la version 4.2.2:
#   https://github.com/rspamd/rspamd/blob/4.2.2/src/plugins/lua/whitelist.lua
#
# -----------------------------------------------------------------------------
# POR QUE ESTE ARCHIVO ES EL MAS IMPORTANTE PARA UN CLIENTE NUEVO
# -----------------------------------------------------------------------------
# Un filtro que nunca rechaza correo legitimo no existe. Lo que se hace es
# detectar temprano que un remitente es de fiar y evitar que el mensaje llegue
# siquiera a puntuarse. Un correo que pasa por la lista blanca no lo evalua el
# filtro, con lo que NO puede ser descartado.
#
# Para una Pyme, el primer lugar donde se busca es siempre el mismo: los
# clientes que escriben todos los dias (facturas, remesas, boletas), los
# proveedores de la boleta electronica y los bancos.
# -----------------------------------------------------------------------------
#
# -----------------------------------------------------------------------------
# ESTRUCTURA DE UNA REGLA
# -----------------------------------------------------------------------------
#   NOMBRE_DE_LA_REGLA {        <- el nombre es el simbolo, debe ir en MAYUSCULAS
#     priority = 1;             <- mas bajo = se evalua antes
#     domains = ["..."];        <- string simple, lista, o mapa
#     score = 2.0;              <- puntos que resta a la puntuacion final
#     blacklist = false;        <- `true` invierte: en vez de excepcionar
#                                <- lo vuelve una lista de rechazo
#     strict = false;           <- `true` exige mayusculas y minusculas exactas
#   }
# -----------------------------------------------------------------------------

whitelist {
  # Cuando el correo viene autenticado (SPF/DKIM/DMARC en `allow`) y ademas
  # el remitente esta en la lista blanca, se acepta sin puntuar.
  # El modulo usa estos simbolos para saber si el remitente ya fue validado.
  dkim_allow_symbol = "R_DKIM_ALLOW";
  spf_allow_symbol = "R_SPF_ALLOW";
  dmarc_allow_symbol = "DMARC_POLICY_ALLOW";

  # Aplicar tambien a los remitentes en redes locales.
  # Se deja en `false`: abrir la excepcion a la red LAN es una decision
  # consciente, no un default.
  check_local = false;

  rules {
    # -------------------------------------------------------------------
    # EJEMPLO 1 - un dominio de cliente conocido.
    # Reemplazar "ejemplo.cl" por el dominio real.
    # -------------------------------------------------------------------
    WHITELIST_CLIENTE_1 {
      priority = 1;
      domains = ["ejemplo.cl"];
      score = 2.0;
    }

    # -------------------------------------------------------------------
    # EJEMPLO 2 - formulario de mapa, cuando hace falta distinto puntaje.
    # -------------------------------------------------------------------
    WHITELIST_PROVEEDOR_PL {
      priority = 2;
      domains = [
        "proveedor-banco.cl",
        "otro-proveedor.cl" 3.0
      ];
      score = 1.0;
    }

    # -------------------------------------------------------------------
    # EJEMPLO 3 - una direccion de correo puntual, no el dominio completo.
    # Menos recomendado: una sola casilla puede estar comprometida.
    # -------------------------------------------------------------------
    # WHITELIST_CASILLA {
    #   priority = 3;
    #   domains = ["facturacion@ejemplo.cl"];
    #   score = 1.0;
    # }
  }
}