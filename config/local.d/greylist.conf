# =============================================================================
# Greylisting
# =============================================================================
# Ubicacion dentro del contenedor: /etc/rspamd/local.d/greylist.conf
#
# Opciones verificadas contra el codigo fuente de la version 4.2.2:
#   https://github.com/rspamd/rspamd/blob/4.2.2/src/plugins/lua/greylist.lua
#
# -----------------------------------------------------------------------------
# QUE HACE Y POR QUE ES LA MAYOR CAUSA DE QUEJA EN LA PRIMERA SEMANA
# -----------------------------------------------------------------------------
# Rspamd retiene el primer correo de un remitente nuevo y le pide al servidor
# de origen que lo reintente. La mayoria de los servidores legitimos de correo
# corporativo reintentan; la mayoria de los bots de spam no.
#
# El efecto buscado es cheaper filtrado: se descarta mucho spam sin analizarlo
# completo. El efecto no buscado es que un remitente nuevo ve su primer correo
# retrasado 5 a 10 minutos.
#
# En una Pyme esto se traduce en llamadas: "el cliente me escribio y no le
# llego". Si va a activar greylisting, active la lista blanca del modulo
# `whitelist` ANTES, y avise al cliente de este comportamiento en la entrega.
#
# Este archivo esta activo solo si RSPAMD_USE_GREYLIST=1 en el `.env`.
# -----------------------------------------------------------------------------

greylist {
  # Simbolo que Rspamd agrega al mensaje cuando lo retiene.
  symbol = "GREYLIST";

  # Tiempo que el remitente nuevo queda retenido. Valor upstream: 5 minutos.
  # Para una Pyme se sube un poco, para que el reintento del servidor remoto
  # tenga tiempo de ocurrir con holgura.
  timeout = 10m;

  # Cuanto se guarda el registro antes de expirar. Valor upstream: 1 dia.
  expire = 1d;

  # Tiempo de espera de la consulta a Redis, en segundos.
  # Redis es obligatorio para que esto funcione.
  redis_timeout = 1.0;

  # Prefijo de las claves en Redis. NO cambiar si ya hay registros: al
  # cambiarlos se pierde el historial de greylist y todos los remitentes
  # aceptados vuelven a ser "nuevos" y a quedar retenidos una vez.
  key_prefix = "rg";

  # Cuanto del cuerpo se usa para calcular la huella del mensaje.
  max_data_len = 10240;
}