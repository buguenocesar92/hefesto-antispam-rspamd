# =============================================================================
# Antivirus (ClamAV)
# =============================================================================
# Ubicacion dentro del contenedor: /etc/rspamd/local.d/antivirus.conf
#
# ESTE ARCHIVO SOLO SURTE EFECTO CON EL PERFIL "antivirus" ACTIVADO:
#
#     docker compose --profile antivirus up -d
#
# Opciones verificadas contra el codigo fuente de la version 4.2.2:
#   https://github.com/rspamd/rspamd/blob/4.2.2/src/plugins/lua/antivirus.lua
#
# -----------------------------------------------------------------------------
# ClamAV ES LO MAS CARO DEL KIT EN MEMORIA
# -----------------------------------------------------------------------------
# clamd carga el conjunto completo de firmas en RAM al arrancar. Una instancia
# normal se lleva entre 1 GB y 2 GB. Si el servidor no tiene esa memoria libre,
# el proceso puede ser terminado por el kernel durante la carga y el
# antivirus queda caido sin avisar.
#
# Ver README.md, seccion "Requisitos", para el calculo de RAM.
# -----------------------------------------------------------------------------

antivirus {
  # Servidores clamd a los que consultar.
  # `clamav` es el nombre del servicio en compose.yaml.
  # Puerto 3310: el que escucha clamd por defecto en la imagen oficial.
  # NO se publica en el host: solo se habla por la red interna de Docker.
  servers = "clamav:3310";

  # Simbolo que se agrega al mensaje cuando clamd encuentra algo.
  symbol = "CLAM_VIRUS";

  # Mensajes mas grandes que esto (en bytes) no se escanean.
  # 20 MB es el valor por defecto de Rspamd. Un correo de 20 MB con adjunto
  # gigante casi nunca vale la pena escanearlo, y el tiempo de escaneo se
  # paga en la cola de entrada.
  max_size = 20000000;

  # Anotar tambien los mensajes limpios en el registro.
  # Util para auditar, pero genera mucho texto. En un servidor chico se puede
  # dejar en `false` y revisar solo los hallazgos.
  log_clean = false;

  # Si clamd no responde, que se hace con el mensaje.
  # `reject` es lo seguro: un antivirus caido no es antivirus.
  # OJO: si clamd se cae, con esta opcion Rspamd empieza a RECHAZAR todo el
  # correo entrante. Es el comportamiento correcto desde seguridad, pero hay
  # que saberlo antes de que pase. Ver docs/07-PRUEBAS-DE-ACEPTACION.md.
  symbol_fail = "ANTIVIRUS_FAIL";

  # No escanear si el mensaje viene cifrado: clamd no puede leerlo y solo
  # gastaria tiempo. El simbolo resultante lo deja claro en el reporte.
  symbol_encrypted = "ANTIVIRUS_ENCRYPTED";
}