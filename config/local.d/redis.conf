# =============================================================================
# Conexion a Redis
# =============================================================================
# Ubicacion dentro del contenedor: /etc/rspamd/local.d/redis.conf
#
# Este archivo se carga dentro de la seccion `redis` de la configuracion, asi
# que aqui NO se escribe un bloque `redis { }`: solo las claves.
#
# Sintaxis verificada en la documentacion oficial de Rspamd:
#   https://rspamd.com/  -> seccion "Connect Rspamd to Redis", que muestra
#   exactamente `servers = "127.0.0.1";` en /etc/rspamd/local.d/redis.conf
#
# POR QUE ES OBLIGATORIO EN ESTE KIT
# La configuracion que viene de fabrica NO trae servidor Redis definido. Rspamd
# arranca igual, pero quedan apagadas tres capas: el clasificador bayesiano, el
# greylisting y el rate limiting. Es un fallo silencioso, por eso se documenta
# aqui y hay un healthcheck de Redis en compose.yaml.
#
# `redis` es el nombre del servicio en compose.yaml (red de Docker).

servers = "redis:6379";

# -----------------------------------------------------------------------
# PENDIENTE DE VERIFICAR EN EL SERVIDOR
# -----------------------------------------------------------------------
# La seccion `redis` acepta mas opciones (base de datos logica, tiempo de
# espera, usuario y contrasena, TLS). Este kit deja SOLO `servers`, que es la
# unica clave cuya sintaxis se pudo confirmar en la documentacion oficial.
#
# Para ver el juego completo de opciones que la version instalada realmente
# acepta, consultar el volcado de configuracion en el servidor:
#
#     docker compose exec rspamd rspamadm configdump
#
# No se agregan aqui claves que no se hayan verificado en esa version.
# -----------------------------------------------------------------------